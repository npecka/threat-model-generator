---
# Redis for Quay caching and session storage
# THREAT INJECTION: T01 (Unauthenticated Access), T04 (Missing Network Segmentation), T10 (Missing Resource Limits)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: quay-system
  labels:
    app: redis
    component: cache
spec:
  replicas: 1  # Minimal deployment - single replica
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
        component: cache
    spec:
      containers:
      - name: redis
        image: redis:7-alpine
        ports:
        - containerPort: 6379
          name: redis
        command:
          - redis-server
          # T01: Redis running without authentication (no --requirepass)
          - --appendonly
          - "yes"
        # T10: No resource limits
        # resources:
        #   limits:
        #     cpu: "500m"
        #     memory: "512Mi"
        #   requests:
        #     cpu: "250m"
        #     memory: "256Mi"
        volumeMounts:
        - name: redis-storage
          mountPath: /data
      volumes:
      - name: redis-storage
        emptyDir: {}

---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: quay-system
  labels:
    app: redis
spec:
  type: ClusterIP
  ports:
  - port: 6379
    targetPort: 6379
    protocol: TCP
    name: redis
  selector:
    app: redis
  # T04: No network policy restricting access to Redis
