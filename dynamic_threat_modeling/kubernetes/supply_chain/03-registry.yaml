# Docker Registry - Container Image Storage with Vulnerabilities
# T5: Anonymous Registry Access (no authentication)
# T3: Unencrypted Flow (HTTP)
# T10: Missing Resource Limits
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: registry-data
  namespace: cicd-zone
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 20Gi
---
# THREAT T5: Registry configuration with no authentication
apiVersion: v1
kind: ConfigMap
metadata:
  name: registry-config
  namespace: cicd-zone
data:
  config.yml: |
    version: 0.1
    log:
      fields:
        service: registry
    storage:
      cache:
        blobdescriptor: inmemory
      filesystem:
        rootdirectory: /var/lib/registry
    http:
      addr: :5000
      headers:
        X-Content-Type-Options: [nosniff]
    # THREAT T5: No authentication configured
    # auth:
    #   htpasswd:
    #     realm: basic-realm
    #     path: /auth/htpasswd
    health:
      storagedriver:
        enabled: true
        interval: 10s
        threshold: 3
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: registry
  namespace: cicd-zone
spec:
  replicas: 1
  selector:
    matchLabels:
      app: registry
  template:
    metadata:
      labels:
        app: registry
        component: artifact-storage
    spec:
      containers:
      - name: registry
        image: registry:2.8
        ports:
        - name: http
          containerPort: 5000
        env:
        - name: REGISTRY_STORAGE_FILESYSTEM_ROOTDIRECTORY
          value: /var/lib/registry
        # THREAT T5: No auth environment variables set
        # - name: REGISTRY_AUTH
        #   value: htpasswd
        # - name: REGISTRY_AUTH_HTPASSWD_PATH
        #   value: /auth/htpasswd
        # THREAT T10: No resource limits
        # resources:
        #   requests:
        #     memory: "256Mi"
        #     cpu: "250m"
        #   limits:
        #     memory: "512Mi"
        #     cpu: "500m"
        volumeMounts:
        - name: registry-data
          mountPath: /var/lib/registry
        - name: registry-config
          mountPath: /etc/docker/registry
      volumes:
      - name: registry-data
        persistentVolumeClaim:
          claimName: registry-data
      - name: registry-config
        configMap:
          name: registry-config
---
apiVersion: v1
kind: Service
metadata:
  name: registry
  namespace: cicd-zone
spec:
  type: ClusterIP
  selector:
    app: registry
  ports:
  - name: http
    port: 5000
    targetPort: 5000
    protocol: TCP  # T3: Unencrypted (HTTP, not HTTPS)
# THREAT T5: Registry accessible without authentication
# Anyone in cluster can push/pull images
