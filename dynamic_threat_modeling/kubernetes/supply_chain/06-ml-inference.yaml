# =============================================================================
# ML Inference Service Deployment
# =============================================================================
# Component: ML Inference API
# Zone: Production (prod-zone)
# Purpose: Serves ML model predictions via REST API
#
# ⚠️ INTENTIONAL VULNERABILITIES:
#   T13: Model Theft via API - No rate limiting or authentication
#   T17: Exposed Model Metadata - Debug endpoints expose internals
#   T14: Unencrypted Model Transfer - HTTP download from MLflow
#   T03: Unencrypted Communication - HTTP API
#   T08: Exposed Secrets - API keys in ConfigMap
#   T10: Missing Resource Limits - No resource constraints
# =============================================================================

---
# ConfigMap: ML Inference Configuration
apiVersion: v1
kind: ConfigMap
metadata:
  name: ml-inference-config
  namespace: prod-zone
  annotations:
    threat-model/t08: "API keys in ConfigMap"
    threat-model/t17: "Debug mode enabled"
data:
  # T08: API credentials in ConfigMap
  MLFLOW_TRACKING_URI: "http://mlflow-server.cicd-zone.svc.cluster.local:5000"
  MODEL_NAME: "fraud_detection_model"
  MODEL_VERSION: "1"

  # T17: Debug mode enabled (exposes model internals)
  DEBUG_MODE: "true"
  ENABLE_MODEL_INFO_ENDPOINT: "true"

  # T13: No rate limiting configuration
  RATE_LIMIT_ENABLED: "false"

  # Database connection for feature data
  # T08: Database password in ConfigMap
  DB_HOST: "postgres.prod-zone.svc.cluster.local"
  DB_PORT: "5432"
  DB_NAME: "app_db"
  DB_USER: "app_user"
  DB_PASSWORD: "app_password_789"  # T08: Hardcoded password

---
# Deployment: ML Inference Service
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ml-inference
  namespace: prod-zone
  labels:
    app: ml-inference
    component: inference-api
    zone: production
  annotations:
    threat-model/t10: "No resource limits"
    threat-model/t13: "No authentication or rate limiting"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ml-inference
  template:
    metadata:
      labels:
        app: ml-inference
        component: inference-api
    spec:
      # T10: No resource limits specified
      containers:
      - name: inference-api
        # Image from internal registry (demonstrates T14: unencrypted transfer from registry)
        image: registry.cicd-zone.svc.cluster.local:5000/ml-inference:vulnerable
        imagePullPolicy: Always
        ports:
        - containerPort: 8000
          name: http
          protocol: TCP
        env:
        # Load all config from ConfigMap
        - name: MLFLOW_TRACKING_URI
          valueFrom:
            configMapKeyRef:
              name: ml-inference-config
              key: MLFLOW_TRACKING_URI
        - name: MODEL_NAME
          valueFrom:
            configMapKeyRef:
              name: ml-inference-config
              key: MODEL_NAME
        - name: MODEL_VERSION
          valueFrom:
            configMapKeyRef:
              name: ml-inference-config
              key: MODEL_VERSION
        - name: DEBUG_MODE
          valueFrom:
            configMapKeyRef:
              name: ml-inference-config
              key: DEBUG_MODE
        - name: ENABLE_MODEL_INFO_ENDPOINT
          valueFrom:
            configMapKeyRef:
              name: ml-inference-config
              key: ENABLE_MODEL_INFO_ENDPOINT
        - name: RATE_LIMIT_ENABLED
          valueFrom:
            configMapKeyRef:
              name: ml-inference-config
              key: RATE_LIMIT_ENABLED
        # T08: Database credentials from ConfigMap
        - name: DB_HOST
          valueFrom:
            configMapKeyRef:
              name: ml-inference-config
              key: DB_HOST
        - name: DB_PASSWORD
          valueFrom:
            configMapKeyRef:
              name: ml-inference-config
              key: DB_PASSWORD
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 15
          periodSeconds: 20

---
# Service: ML Inference API
apiVersion: v1
kind: Service
metadata:
  name: ml-inference
  namespace: prod-zone
  labels:
    app: ml-inference
    component: inference-api
  annotations:
    threat-model/t13: "No authentication on prediction endpoint"
    threat-model/t03: "Unencrypted HTTP traffic"
spec:
  type: ClusterIP
  ports:
  - port: 8000
    targetPort: 8000
    protocol: TCP
    name: http  # T03: HTTP, not HTTPS
  selector:
    app: ml-inference

---
# RBAC: Allow Jenkins to Deploy ML Inference Service
# This creates T15 (CI/CD to Production Access)
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: jenkins-ml-deployment
  namespace: prod-zone
  annotations:
    threat-model/t15: "Jenkins can deploy to production ML services"
    threat-model/t06: "CI/CD to production access"
subjects:
- kind: ServiceAccount
  name: jenkins
  namespace: cicd-zone
roleRef:
  kind: ClusterRole
  name: edit  # T15: Overly permissive (can update deployments)
  apiGroup: rbac.authorization.k8s.io
